name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Script syntax + Quest patches
        run: |
          bash tests/test_scripts.sh
          test -f patches/0001-meta-quest-phone-email-auth.patch
          test -f patches/0002-meta-quest-product-flavor.patch
          test -f LICENSE
